[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecowing-detection-system"
version = "1.0.0"
description = "EcoWing AI Waste Detection Sensor & Live Video Streaming Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "ultralytics>=8.3.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "pydantic>=2.8.0",
    "websockets>=13.0",
    "requests>=2.32.0",
    "python-multipart>=0.0.9",
    "jsonschema>=4.23.0",
    "pyyaml>=6.0.2"
]

[project.scripts]
detection-system = "detection_system.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
detection_system = [
    "contracts/*",
    "contracts/schemas/*",
    "web/templates/*",
    "web/static/css/*",
    "web/static/js/*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/detection_system", "src"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient.*:",
    "ignore::DeprecationWarning:websockets.legacy.*:",
    "ignore::DeprecationWarning:uvicorn.protocols.websockets.*:"
]

[tool.pyright]
extraPaths = ["src/detection_system", "src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
