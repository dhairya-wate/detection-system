services:
  - type: web
    name: ecowing-detection-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/detections
    envVars:
      - key: PORT
        value: "10000"
      - key: ALLOW_LAN
        value: "true"
      - key: MOBILE_ENABLED
        value: "true"
      - key: DETECTION_ENV
        value: "production"
      - key: DETECTION_OPERATOR_TOKEN
        value: "secure_operator_token_9xK2mP7qR4vL8wZ1"
      - key: DETECTION_SERVICE_TOKEN
        value: "secure_service_token_8vK3mP7qR4vL8wZ2"
      - key: ECOWING_API_URL
        value: "https://eco-wing.vercel.app"
      - key: CORS_ORIGINS
        value: "https://eco-wing.vercel.app,https://ecowing-detection-system.onrender.com,http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5000,http://127.0.0.1:5000"
